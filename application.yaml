apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ThePremkumar/manifests.git
    targetRevision: main
    path: cd

  destination:
    server: https://kubernetes.default.svc
    namespace: moodscape

  syncPolicy:
    syncOptions:
      - CreateNamespace=true

    automated:
      selfHeal: true
      prune: true
    
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
apiVersion: v1
kind: Secret
metadata:
  name: manifests-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/ThePremkumar/manifests.git
  username: ThePremkumar
  password: ghp_YourActualGitHubTokenGoesHere